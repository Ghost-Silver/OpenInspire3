name: OpenInspire3 CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc-13
          - os: macos-14
            compiler: apple-clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Submodules (HTTPS Rewrite)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Linux Dependencies (LLVM/MLIR & GCC-13)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 cmake ninja-build libomp-dev llvm-18-dev libmlir-18-dev mlir-18-tools zlib1g-dev libzstd-dev libopenblas-dev
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV
          echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> $GITHUB_ENV
          echo "MLIR_DIR=/usr/lib/llvm-18/lib/cmake/mlir" >> $GITHUB_ENV

      - name: Cache Homebrew LLVM
        if: runner.os == 'macOS'
        id: cache-homebrew-llvm
        uses: actions/cache@v4
        with:
          path: |
            /opt/homebrew/opt/llvm@18
            /opt/homebrew/Cellar/llvm@18
          key: ${{ runner.os }}-homebrew-llvm18-v1

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja libomp || true
          echo "OPENMP_ROOT=$(brew --prefix libomp)" >> $GITHUB_ENV
          if [ ! -d "/opt/homebrew/opt/llvm@18" ]; then
            brew install llvm@18
          fi
          echo "LLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm" >> $GITHUB_ENV
          echo "MLIR_DIR=$(brew --prefix llvm@18)/lib/cmake/mlir" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          EXTRA_ARGS=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            EXTRA_ARGS="-DOpenMP_ROOT=${OPENMP_ROOT}"
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOI3_ENABLE_C3=ON \
            $EXTRA_ARGS

      - name: Build OpenInspire3 Targets
        run: |
          cmake --build build --target oi3_simulator DroneSimulation test_sim PidHoverTest SixDofHoverTest SixDofGradTest test_ppo_grad MinimumSnapTest \
            || {
              ninja -C build -v -j 1 oi3_simulator DroneSimulation test_sim PidHoverTest SixDofHoverTest SixDofGradTest test_ppo_grad MinimumSnapTest || true
              exit 1
            }

      - name: Run CTest Regression Suite
        run: |
          ctest -j 1 --test-dir build --output-on-failure
