name: OpenInspire3 CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc-13
          - os: macos-14
            compiler: apple-clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Submodules (HTTPS Rewrite)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install modern CMake & Ninja
        run: |
          pip install --upgrade pip cmake ninja

      - name: Install Linux Dependencies (LLVM/MLIR & GCC-13)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 libomp-dev llvm-18-dev libmlir-18-dev mlir-18-tools zlib1g-dev libzstd-dev
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV
          echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH
          echo "LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm" >> $GITHUB_ENV
          echo "MLIR_DIR=/usr/lib/llvm-18/lib/cmake/mlir" >> $GITHUB_ENV

      - name: Cache Homebrew LLVM
        if: runner.os == 'macOS'
        id: cache-homebrew-llvm
        uses: actions/cache@v4
        with:
          path: |
            /opt/homebrew/opt/llvm@18
            /opt/homebrew/Cellar/llvm@18
          key: ${{ runner.os }}-homebrew-llvm18-v1

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install libomp || true
          echo "OPENMP_ROOT=$(brew --prefix libomp)" >> $GITHUB_ENV
          if [ ! -d "/opt/homebrew/opt/llvm@18" ]; then
            brew install llvm@18
          fi
          echo "LLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm" >> $GITHUB_ENV
          echo "MLIR_DIR=$(brew --prefix llvm@18)/lib/cmake/mlir" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOI3_ENABLE_C3=ON

      - name: Build OpenInspire3 Targets
        run: |
          cmake --build build --target oi3_simulator DroneSimulation test_sim PidHoverTest SixDofHoverTest SixDofGradTest test_ppo_grad MinimumSnapTest \
            || {
              echo "::error title=OI3 Build Failure::Build failed, running verbose build:"
              ninja -C build -v -j 1 || true
              exit 1
            }

      - name: Run CTest Regression Suite
        run: |
          ctest --test-dir build --output-on-failure
